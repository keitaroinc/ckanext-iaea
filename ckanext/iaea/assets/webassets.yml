iaea-js:
  filter: rjsmin
  output: ckanext-iaea/%(version)s-iaea.js
  contents:
    - js/iaea.js
    - js/recline-map-popup.js
  extra:
    preload:
      - base/main

iaea-css:
  filter: cssrewrite
  output: ckanext-iaea/%(version)s-iaea.css
  contents:
    - css/iaea.css
    - css/custom.css
    - css/map-popups.css
    - css/visualize_main.css

recline-map-popup-js:
  filter: rjsmin
  output: ckanext-iaea/%(version)s-recline-map-popup.js
  contents:
    - js/recline-map-popup.js
  extra:
    preload:
      - ckanext-reclineview/main

rtl-css:
  filter: cssrewrite
  output: ckanext-iaea/%(version)s-rtl.css
  contents:
    - css/rtl.css
